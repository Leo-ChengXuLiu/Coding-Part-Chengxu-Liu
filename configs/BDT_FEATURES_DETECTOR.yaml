schema_version: tc_bdt_10tev_bp3_detector_v2_tracking

event_bdt:
  features:
    - njet_all
    - njet_e500
    - nlepton_prompt_iso
    - n_visible
    - n_charged
    - n_neutral
    - visible_e
    - visible_pt
    - visible_mass
    - missing_e
    - missing_pt
    - missing_mass
    - thrust
    - thrust_major
    - thrust_minor
    - sphericity
    - aplanarity
    - c_parameter
    - d_parameter
    - j1_mass
    - j1_energy
    - j1_pt
    - j1_eta
    - j1_rapidity
    - j1_phi
    - j1_cos_theta
    - j2_mass
    - j2_energy
    - j2_pt
    - j2_eta
    - j2_rapidity
    - j2_phi
    - j2_cos_theta
    - hj_mass
    - hj_energy
    - hj_pt
    - hj_eta
    - hj_rapidity
    - hj_phi
    - hj_cos_theta
    - lj_mass
    - lj_energy
    - lj_pt
    - lj_eta
    - lj_rapidity
    - lj_phi
    - lj_cos_theta
    - mjj
    - ejj
    - ptjj
    - yjj
    - delta_phi_jj
    - delta_eta_jj
    - delta_y_jj
    - delta_r_jj
    - opening_angle_jj
    - acoplanarity_jj
    - energy_asymmetry
    - pt_asymmetry
    - mass_asymmetry
    - abs_cos_theta_hj
    - roe_n_candidates
    - roe_energy
    - roe_candidate_fraction
    - roe_energy_fraction
    - hj_lj_candidate_fraction
    - hj_lj_energy_fraction

jet_flavor_stage:
  scope: detector_reconstructed_no_truth_proxy
  features:
    - mass
    - energy
    - pt
    - eta
    - rapidity
    - cos_theta
    - n_constituents
    - n_charged
    - n_neutral
    - n_photon
    - n_electron
    - n_muon
    - charged_energy_fraction
    - neutral_energy_fraction
    - em_energy_fraction
    - had_energy_fraction
    - lead_constituent_fraction
    - ptd
    - girth
    - width
    - jet_charge_k03
    - jet_charge_k05
    - jet_charge_k10
    - tau1
    - tau2
    - tau3
    - tau21
    - tau32
    - ecf1
    - ecf2
    - ecf3
    - c2
    - d2
    - n2
    - softdrop_mass
    - softdrop_zg
    - softdrop_rg
    - n_soft_electrons
    - n_soft_muons
    - soft_lepton_ptrel_max
    - n_ip_tracks
    - n_ip2d_sig_gt2
    - n_ip2d_sig_gt3
    - n_ip3d_sig_gt2
    - n_ip3d_sig_gt3
    - ip2d_sig_abs_max
    - ip2d_sig_abs_second
    - ip2d_sig_abs_mean
    - ip2d_sig_abs_median
    - ip2d_sig_abs_sum
    - ipz_sig_abs_max
    - ipz_sig_abs_mean
    - ip3d_sig_abs_max
    - ip3d_sig_abs_second
    - ip3d_sig_abs_mean
    - ip3d_sig_abs_sum
    - displaced_track_pt_fraction_sig2
    - displaced_track_energy_fraction_sig2
  target: truth_flavor
  target_classes: [b, c, light]

double_stage_event_bdt:
  extends: event_bdt.features
  required_out_of_fold_features:
    - hj_role_p_b_oof
    - lj_role_p_c_oof
  role_complete_out_of_fold_features:
    - hj_role_p_b_oof
    - lj_role_p_c_oof
    - lj_role_p_b_oof
    - lj_role_c_over_b_log_score_oof
    - tc_role_score_product_oof
    - tc_role_score_contrast_oof
  diagnostic_out_of_fold_features:
    - lj_role_not_b_oof

forbidden_patterns:
  - label
  - process_id
  - sample_id
  - event_id
  - paper_weight
  - pass_cut
  - truth_
  - raw_track_
  - model_
  - wilson_
